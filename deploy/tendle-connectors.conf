# Existing public ingress terminates public TLS and verifies this origin's certificate.
server {
    listen 8443 ssl;
    server_name tendle-connectors.internal;
    ssl_certificate /etc/tendle/tls/origin.crt;
    ssl_certificate_key /etc/tendle/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 143.198.154.237;
    deny all;
    access_log off;
    error_log /var/log/nginx/tendle-error.log crit;
    client_max_body_size 64k;

    proxy_set_header Host tendle.ai;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 70s;
    proxy_next_upstream off;
    add_header Cache-Control "no-store" always;

    location = /connectors/hyperliquid/mcp/icon {
        default_type image/png;
        alias /opt/hosted-hyperliquid-mcp/deploy/icon.png;
    }
    location = /connectors/hyperliquid {
        default_type text/html;
        return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hyperliquid - Tendle</title></head><body><p>Coming soon.</p><a href="/connectors/hyperliquid/manifest.json">Connector metadata</a></body></html>';
    }
    location = /connectors/hyperliquid/manifest.json {
        default_type application/json;
        alias /opt/hosted-hyperliquid-mcp/deploy/connector.json;
    }
    location = /connectors/hyperliquid/mcp/docs {
        proxy_pass http://127.0.0.1:8080/mcp/docs;
    }
    location = /connectors/hyperliquid/mcp {
        proxy_pass http://127.0.0.1:8080/mcp;
    }
    location = /connectors/hyperliquid/healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
    }
    location / { return 404; }
}
