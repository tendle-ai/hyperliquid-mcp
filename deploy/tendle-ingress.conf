# Connector-only location snippet for the existing tendle.ai HTTPS server block.
# Source: /etc/nginx/sites-available/studio-domain on 143.198.154.237.
# Requires the existing tendle_connector rate-limit zone and origin CA certificate.
# Replace matching locations; do not include alongside duplicate locations.
location = /connector/hyperliquid {
  access_log off;
  error_log /var/log/nginx/tendle-connector-error.log crit;
  client_max_body_size 64k;
  limit_req zone=tendle_connector burst=20 nodelay;
  limit_req_status 429;
  proxy_pass https://146.190.56.100:8443;
  proxy_ssl_server_name on;
  proxy_ssl_name tendle-connectors.internal;
  proxy_ssl_trusted_certificate /etc/nginx/tendle-connector-origin.crt;
  proxy_ssl_verify on;
  proxy_set_header Host tendle.ai;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 75s;
  proxy_next_upstream off;
 }

